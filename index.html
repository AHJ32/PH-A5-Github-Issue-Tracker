<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Tailwind+DaisyUI CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Remix Icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
      integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .geist {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="geist bg-[#f8fafc] rounded-lg">
    <main class="min-h-dvh mx-auto w-[90%] my-4 bg-[#FFFFFF] shadow">
      <div class="login-top mx-auto text-center">
        <img
          class="mx-auto mb-6"
          src="./assets/github-logo.png"
          alt="Github logo"
        />
        <h2 class="font-semibold text-[1.5rem]">GitHub Issues Tracker</h2>
        <p class="font-normal text-[1rem] text-[#64748B]">
          Sign in to manage your issues
        </p>
      </div>
      <fieldset class="fieldset rounded-box w-xs px-4 py-6">
        <label class="label font-medium text-[1rem] text-[#1F2937]"
          >Username</label
        >
        <input type="email" class="input" placeholder="Enter Username" />
        <p class="font-normal text-[.875rem] text-[#4A00FF]">Default: admin</p>
        <label class="label font-medium text-[1rem] text-[#1F2937] mt-4"
          >Password</label
        >
        <input type="password" class="input" placeholder="Password" />
        <p class="font-normal text-[.875rem] text-[#4A00FF] mb-6">
          Default: admin123
        </p>
        <button class="btn btn-primary mt-4">Sign In</button>
      </fieldset>
    </main>
  </body>
</html>
