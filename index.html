<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Tailwind+DaisyUI CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Remix Icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
      integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .geist {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="geist bg-[#f8fafc] flex flex-col items-center justify-center min-h-screen">
    <main class="w-[95%] sm:w-[80%] sm:max-w-sm lg:max-w-md mx-auto my-6 bg-[#FFFFFF] rounded-lg shadow py-6">
      <div class="w-[90%] mx-auto">
        <div class="login-top mx-auto text-center">
          <img
            class="mx-auto mb-6 w-12 h-12 sm:w-16 sm:h-16"
            src="./assets/github-logo.png"
            alt="Github logo"
          />
          <h2 class="font-semibold text-[1.5rem]">GitHub Issues Tracker</h2>
          <p class="font-normal text-[1rem] text-[#64748B]">
            Sign in to manage your issues
          </p>
        </div>
        <form id="loginForm" class="fieldset rounded-box py-6">
          <label class="label font-medium text-[1rem] text-[#1F2937]"
            >Username</label
          >
          <input
            type="text"
            id="username"
            class="input w-full"
            placeholder="Enter Username"
          />
          <p class="font-normal text-[.875rem] text-[#4A00FF]">
            Default: admin
          </p>
          <label class="label font-medium text-[1rem] text-[#1F2937] mt-4"
            >Password</label
          >
          <input type="password" id="password" class="input w-full" placeholder="Password" />
          <p class="font-normal text-[.875rem] text-[#4A00FF] mb-6">
            Default: admin123
          </p>
          <button type="submit" class="btn btn-primary mt-4 w-full">Sign In</button>
        </form>
        <div class="magic">
          <div class="flex items-center">
            <div class="flex-grow border-t border-[#E4E4E7]"></div>
            <span
              class="mx-4 flex-shrink text-[#1F2937] font-normal text-[1rem]"
              >OR</span
            >
            <div class="flex-grow border-t border-[#E4E4E7]"></div>
          </div>
        </div>
        <div class="px-2 mt-6 text-center">
          <p class="font-normal text-[.875rem] text=[#64748B]">
            Demo Credentials:
          </p>
          <div class="mt-2 py-6 bg-[#F8FAFC] rounded-lg">
            <p class="font-semibold">
              Username: <span class="font-normal">admin</span>
            </p>
            <p class="font-semibold">
              Password: <span class="font-normal">admin123</span>
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="./js/login.js" type="module"></script>
  </body>
</html>
