<!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>GitHub Issues Tracker</title>
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
      <style>
        * { font-family: "Geist", sans-serif; }
        .card-open   { border-top: 3px solid #22c55e; }
        .card-closed { border-top: 3px solid #a855f7; }
        #spinner      { display: none; }
        #spinner.show { display: flex; }
        #noResults      { display: none; }
        #noResults.show { display: block; }
        .tab-btn-active {
          background-color: #6366f1 !important;
          color: #fff !important;
          border-color: #6366f1 !important;
        }
        .priority-HIGH   { background:#fce7f3; color:#be185d; }
        .priority-MEDIUM { background:#fff7ed; color:#ea580c; }
        .priority-LOW    { background:#f1f5f9; color:#64748b; }
        .label-pill {
          display: inline-flex;
          align-items: center;
          border-radius: 9999px;
          font-size: .7rem;
          padding: 2px 8px;
          font-weight: 500;
          white-space: nowrap;
        }
      </style>
    </head>
    <body class="bg-[#f1f5f9] min-h-screen">

      <!-- NAVBAR -->
      <nav class="bg-white border-b border-[#e4e4e7] px-6 py-3 sticky top-0 z-20 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-2">
            <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8" />
            <span class="font-semibold text-[1.05rem] text-[#1F2937]">GitHub Issues Tracker</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="relative">
              <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-[#94a3b8] text-sm"></i>
              <input id="searchInput" type="text" placeholder="Search issues..."
                class="pl-9 pr-4 py-2 border border-[#e4e4e7] rounded-lg text-sm w-56 focus:outline-none focus:border-indigo-400 bg-[#f8fafc]" />
            </div>
            <button id="newIssueBtn"
              class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
              <i class="ri-add-line"></i> New Issue
            </button>
          </div>
        </div>
      </nav>

      <!-- PAGE BODY -->
      <div class="max-w-6xl mx-auto px-4 py-6">

        <!-- TABS -->
        <div class="flex gap-2 mb-4">
          <button data-tab="all"
            class="tab-btn tab-btn-active px-5 py-1.5 rounded-full text-sm font-medium border border-indigo-600 transition-all">All</button>
          <button data-tab="open"
            class="tab-btn px-5 py-1.5 rounded-full text-sm font-medium border border-[#e4e4e7] bg-white text-[#374151] hover:border-indigo-400 transition-all">Open</button>
          <button data-tab="closed"
            class="tab-btn px-5 py-1.5 rounded-full text-sm font-medium border border-[#e4e4e7] bg-white text-[#374151] hover:border-indigo-400 transition-all">Closed</button>
        </div>

        <!-- ISSUES PANEL -->
        <div class="bg-white rounded-xl shadow-sm border border-[#e4e4e7] overflow-hidden">

          <!-- Panel Header -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between px-5 py-4 border-b border-[#f1f5f9]">
            <div class="flex items-center gap-3">
              <img src="./assets/Aperture.png" alt="Aperture" class="w-10 h-10 rounded-full object-cover" />
              <div>
                <p id="issueCount" class="font-bold text-[1.05rem] text-[#1F2937]">0 Issues</p>
                <p class="text-xs text-[#64748b]">Track and manage your project issues</p>
              </div>
            </div>
            <!-- Static labels only — no dynamic counts -->
            <div class="flex items-center gap-4 mt-3 sm:mt-0 text-sm">
              <span class="flex items-center gap-1.5 text-[#374151]">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>
                Open
              </span>
              <span class="flex items-center gap-1.5 text-[#374151]">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"></span>
                Closed
              </span>
            </div>
          </div>

          <!-- SPINNER -->
          <div id="spinner" class="show flex justify-center items-center py-16">
            <span class="loading loading-spinner loading-md text-indigo-600"></span>
            <span class="ml-3 text-sm text-[#64748b]">Loading issues...</span>
          </div>

          <!-- GRID -->
          <div id="issuesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 p-4"></div>

          <!-- NO RESULTS -->
          <div id="noResults" class="text-center py-16 text-[#94a3b8]">
            <i class="ri-search-eye-line text-4xl mb-3 block"></i>
            <p class="font-medium">No issues found</p>
          </div>

        </div>
      </div>

      <!-- MODAL -->
      <dialog id="issueModal" class="modal">
        <div class="modal-box w-11/12 max-w-2xl rounded-xl">
          <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3">✕</button>
          </form>
          <div id="modalContent"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
      </dialog>

      <script src="./js/main.js?v=1774705237990" type="module"></script>
    </body>
  </html>
