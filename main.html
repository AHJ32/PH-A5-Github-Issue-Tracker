<!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>GitHub Issues Tracker</title>
      <!-- Tailwind+DaisyUI CSS -->
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <!-- Remix Icon -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- Google Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
      <style>
        body { font-family: "Geist", sans-serif; }
        .card-open { border-top: 4px solid #22c55e; }
        .card-closed { border-top: 4px solid #a855f7; }
        #spinner { display: none; }
        #spinner.show { display: flex; }
      </style>
    </head>
    <body class="bg-[#f8fafc] min-h-screen">

      <!-- NAVBAR -->
      <nav class="bg-white border-b border-[#E4E4E7] px-4 py-3 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8" />
            <span class="font-semibold text-[1.125rem] text-[#1F2937]">GitHub Issues Tracker</span>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <input
              id="searchInput"
              type="text"
              placeholder="Search issues..."
              class="input input-bordered w-full sm:w-72 text-sm"
            />
            <button id="searchBtn" class="btn btn-primary btn-sm px-4">
              <i class="ri-search-line"></i> Search
            </button>
          </div>
        </div>
      </nav>

      <!-- MAIN CONTENT -->
      <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TAB SECTION HEADER -->
        <div class="bg-white rounded-lg shadow mb-6 overflow-hidden">
          <div class="flex items-center justify-between px-4 py-3 border-b border-[#E4E4E7]">
            <!-- Tabs -->
            <div class="flex gap-1">
              <button data-tab="all" class="tab-btn btn btn-sm btn-primary rounded-full px-4">
                <i class="ri-list-check mr-1"></i> All
              </button>
              <button data-tab="open" class="tab-btn btn btn-sm btn-ghost rounded-full px-4 text-[#64748B]">
                <i class="ri-checkbox-circle-line mr-1 text-green-500"></i> Open
              </button>
              <button data-tab="closed" class="tab-btn btn btn-sm btn-ghost rounded-full px-4 text-[#64748B]">
                <i class="ri-close-circle-line mr-1 text-purple-500"></i> Closed
              </button>
            </div>
            <!-- Issue count -->
            <div class="flex items-center gap-3 text-sm text-[#64748B]">
              <span id="issueCount" class="font-medium text-[#1F2937]">0 Issues</span>
              <span class="flex items-center gap-1 text-green-600">
                <img src="./assets/Open-Status.png" alt="Open" class="w-4 h-4" />
                <span id="openCount">0 Open</span>
              </span>
              <span class="flex items-center gap-1 text-purple-600">
                <img src="./assets/Closed- Status .png" alt="Closed" class="w-4 h-4" />
                <span id="closedCount">0 Closed</span>
              </span>
            </div>
          </div>
        </div>

        <!-- LOADING SPINNER -->
        <div id="spinner" class="show flex justify-center items-center py-20">
          <span class="loading loading-spinner loading-lg text-primary"></span>
          <span class="ml-3 text-[#64748B]">Loading issues...</span>
        </div>

        <!-- ISSUES GRID -->
        <div id="issuesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- NO RESULTS -->
        <div id="noResults" class="hidden text-center py-20 text-[#64748B]">
          <i class="ri-search-eye-line text-5xl mb-4 block"></i>
          <p class="text-lg font-medium">No issues found</p>
        </div>
      </main>

      <!-- MODAL -->
      <dialog id="issueModal" class="modal">
        <div class="modal-box w-11/12 max-w-2xl">
          <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
          </form>
          <div id="modalContent"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
      </dialog>

      <script src="./js/main.js" type="module"></script>
    </body>
  </html>
